<g class="gray"><rect x="40" y="530" width="134" height="32" rx="6"/><text class="th" x="107" y="551" text-anchor="middle">Sample</text></g>
<line class="arr" x1="174" y1="546" x2="190" y2="546" marker-end="url(#a)"/>
<g class="purple"><rect x="192" y="532" width="92" height="28" rx="5"/><text class="ts" x="238" y="550" text-anchor="middle">sampler · F</text></g>

<g class="coral"><rect x="40" y="570" width="134" height="32" rx="6"/><text class="th" x="107" y="591" text-anchor="middle">Emit</text></g>
<line class="arr" x1="174" y1="586" x2="190" y2="586" marker-end="url(#a)"/>
<g class="purple"><rect x="192" y="572" width="144" height="28" rx="5"/><text class="ts" x="264" y="590" text-anchor="middle">tokenizer/&lt;alg&gt; · K</text></g>
