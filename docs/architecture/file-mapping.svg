<g class="coral"><rect x="40" y="624" width="12" height="12" rx="2"/></g>
<text class="ts" x="60" y="635">spans more than one change axis, so its files split</text>
<g class="teal"><rect x="40" y="646" width="12" height="12" rx="2"/></g>
<text class="ts" x="60" y="657">JavaScript</text>
<g class="purple"><rect x="150" y="646" width="12" height="12" rx="2"/></g>
<text class="ts" x="170" y="657">C++ core</text>
<g class="gray"><rect x="250" y="646" width="12" height="12" rx="2"/></g>
<text class="ts" x="270" y="657">WASM boundary</text>
<text class="ts" x="40" y="684">A file in more than one row serves several boxes, always on its one axis.</text>
</svg>
