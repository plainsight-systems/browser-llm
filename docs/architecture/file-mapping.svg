<g class="purple"><rect x="350" y="270" width="118" height="28" rx="5"/><text class="ts" x="409" y="288" text-anchor="middle">arch/&lt;arch&gt; · A</text></g>

<text class="ts" x="40" y="322">Generate</text>

<g class="gray"><rect x="40" y="330" width="134" height="32" rx="6"/><text class="th" x="107" y="351" text-anchor="middle">Jinja</text></g>
<line class="arr" x1="174" y1="346" x2="190" y2="346" marker-end="url(#a)"/>
<g class="teal"><rect x="192" y="332" width="124" height="28" rx="5"/><text class="ts" x="254" y="350" text-anchor="middle">web/template · H</text></g>

<g class="gray"><rect x="40" y="370" width="134" height="32" rx="6"/><text class="th" x="107" y="391" text-anchor="middle">Tokenize</text></g>
<line class="arr" x1="174" y1="386" x2="190" y2="386" marker-end="url(#a)"/>
