<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img">
<title>Each logical box mapped to the files that implement it, with each file's change axis</title>
<desc>Twelve logical boxes, each with the files that implement it and the axis each file changes on. Seven boxes span more than one axis and split into files on different axes: Pick, Preflight, Gates, Upload, KV cache, Prefill and Decode, and Emit. Files are coloured by layer: JavaScript, C++ core, or the WASM boundary.</desc>
<style>
  .bg { fill: #FFFFFF; }
  .th { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #2C2C2A; }
  .ts { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5F5E5A; }
  rect { stroke-width: 1; }
  .coral rect  { fill: #FAECE7; stroke: #D85A30; } .coral text  { fill: #712B13; }
  .gray rect   { fill: #F1EFE8; stroke: #888780; } .gray text   { fill: #2C2C2A; }
  .teal rect   { fill: #E1F5EE; stroke: #0F6E56; } .teal text   { fill: #085041; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple text { fill: #3C3489; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#888780" stroke-width="1.5"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="680" height="700"/>

<text class="th" x="40" y="44">Logical box</text>
<text class="th" x="192" y="44">Files, and the axis each changes on</text>

<text class="ts" x="40" y="66">Load</text>

<g class="coral"><rect x="40" y="74" width="134" height="32" rx="6"/><text class="th" x="107" y="95" text-anchor="middle">Pick</text></g>
<line class="arr" x1="174" y1="90" x2="190" y2="90" marker-end="url(#a)"/>
<g class="teal"><rect x="192" y="76" width="111" height="28" rx="5"/><text class="ts" x="247" y="94" text-anchor="middle">web/picker · H</text></g>
<g class="teal"><rect x="311" y="76" width="144" height="28" rx="5"/><text class="ts" x="383" y="94" text-anchor="middle">web/models.json · J</text></g>

<g class="coral"><rect x="40" y="114" width="134" height="32" rx="6"/><text class="th" x="107" y="135" text-anchor="middle">Preflight</text></g>
