<g class="purple"><rect x="305" y="116" width="118" height="28" rx="5"/><text class="ts" x="364" y="134" text-anchor="middle">gguf/reader · C</text></g>

<g class="coral"><rect x="40" y="154" width="134" height="32" rx="6"/><text class="th" x="107" y="175" text-anchor="middle">Gates</text></g>
