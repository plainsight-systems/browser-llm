<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>browser-llm</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="bar">
  <h1>browser-llm</h1>
  <span id="device-status" class="device" data-state="pending"></span>
</header>
<div class="layout">
  <aside class="panel side" aria-label="Models">
    <h2>Models</h2>
    <div id="models"></div>
    <div id="verdict" class="verdict" aria-live="polite"></div>
  </aside>
  <main id="chat" class="panel" aria-label="Chat">
    <p class="empty">Choose a model to start.</p>
  </main>
</div>
<footer class="foot">
  Runs entirely in your browser. Model files are downloaded from Hugging Face
  and cached on this device.
  <a href="https://github.com/plainsight-systems/browser-llm">Source</a>
</footer>
<script type="module" src="./app.js"></script>
</body>
</html>
