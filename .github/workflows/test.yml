name: test

on:
  push:
  pull_request:

jobs:
  native:
    name: Native build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Structural invariants
        run: ./tools/check_boundaries.sh

      - name: Guards fire when violated
        run: ./tests/test_check_boundaries.sh


      - name: Cache fetched test data
        uses: actions/cache@v4
        with:
          path: .cache/test-data
          key: test-data-${{ hashFiles('tests/fixtures/external.json', 'tests/fixtures/tokenizer/manifest.json') }}

      - name: Fetch test data
        run: python3 tools/fetch_test_data.py

      - name: Configure
        run: cmake --preset native-release

      - name: Build
        run: cmake --build --preset native-release

      - name: Test
        run: ctest --preset native-release

  web:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test
        run: node --test tests/web/*.test.js
